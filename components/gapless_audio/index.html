<!DOCTYPE html>
<!-- Gapless audio queue for the CJP voice demo (raw Streamlit component protocol).
     Receives {chunks:[{i, b64}]} on every render; decodes each mp3 ONCE into an
     AudioContext and schedules it to start exactly when the previous buffer ends
     (sample-accurate; seam ~0ms). One "Enable audio" click resumes the
     AudioContext for the whole session (autoplay policy), after which all later
     chunks schedule without further gestures. Reports per-chunk gap_ms back to
     Python via setComponentValue. -->
<html>
<head><meta charset="utf-8">
<style>
  body { margin:0; font-family:sans-serif; }
  #btn { width:100%; padding:8px 14px; border-radius:8px; border:1px solid #888;
         background:#1a5d1a; color:#fff; font-size:15px; cursor:pointer; }
  #btn.ready { background:#333; cursor:default; }
  #st { font-size:12px; color:#666; margin-top:4px; text-align:center; }
</style></head>
<body>
<button id="btn">🔊 Enable audio (only click if you hear nothing)</button>
<div id="st"></div>
<script>
  const btn = document.getElementById("btn"), stat = document.getElementById("st");
  let ctx = null, nextStart = 0, lastEnd = 0;
  const seen = new Set(), pending = new Map(), played = [];
  let expected = 0;   // strict index order: buffer out-of-order arrivals

  function send(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, data||{}), "*");
  }
  function setValue(v){ send("streamlit:setComponentValue", {dataType:"json", value:v}); }

  function enable(){
    if (!ctx) { ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    return ctx.resume().then(()=>{
      try { sessionStorage.setItem("cjp_audio_enabled","1"); } catch(e){}
      btn.textContent = "🔊 Audio enabled"; btn.classList.add("ready");
      stat.textContent = "ready"; drain();
    });
  }
  btn.addEventListener("click", enable);
  // AUTO-UNLOCK (no dedicated click): this component iframe is same-origin with the
  // Streamlit page, so it inherits the parent's sticky user-activation from the
  // record-button click. resume() therefore succeeds on its own. Best-effort on load;
  // the button stays only as a fallback if a browser blocks it.
  try { enable().catch(()=>{}); } catch(e){}

  function b64ToArrayBuffer(b64){
    const bin = atob(b64), len = bin.length, buf = new Uint8Array(len);
    for (let i=0;i<len;i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }

  // [A · streaming] Build an AudioBuffer directly from raw 16-bit mono PCM (no
  // decodeAudioData — that needs a complete encoded file). Used only for streamed
  // tts-1 sub-chunks (fmt='pcm'); mp3/wav chunks still go through decodeAudioData.
  function pcmToBuffer(arraybuf, sr){
    const i16 = new Int16Array(arraybuf), f32 = new Float32Array(i16.length);
    for (let j=0;j<i16.length;j++) f32[j] = i16[j] / 32768;
    const ab = ctx.createBuffer(1, f32.length || 1, sr || 24000);
    ab.copyToChannel(f32, 0);
    return ab;
  }

  function schedule(i, audioBuf){
    const now = ctx.currentTime;
    const start = Math.max(now + 0.02, nextStart);          // gapless: butt-joint to prev end
    const gapMs = lastEnd ? Math.max(0, (start - lastEnd) * 1000) : 0;
    const src = ctx.createBufferSource();
    src.buffer = audioBuf; src.connect(ctx.destination); src.start(start);
    nextStart = start + audioBuf.duration; lastEnd = nextStart;
    // [Task 3 — AUDIBLE ONSET] projected wall-clock instant this buffer BEGINS to sound
    // (src.start(start) is in the AudioContext clock; map it to Date.now()). On the
    // single-machine localhost demo the browser Date.now() and the Python host share
    // the system clock, so the host can subtract its transcript-confirm wall time to
    // get true felt-TTFA. Residual uncertainty: ms resolution + scheduled-vs-actual
    // play jitter (a few ms). Instrumentation only — playback is unchanged (T3.3).
    const tAudibleEpochMs = Date.now() + Math.max(0, (start - ctx.currentTime)) * 1000;
    played.push({i:i, gap_ms: Math.round(gapMs), t_audible_epoch_ms: Math.round(tAudibleEpochMs)});
    stat.textContent = "playing chunk " + (i+1) + " (seam " + Math.round(gapMs) + "ms)";
    setValue({played: played});
  }

  let draining = false;
  function drain(){
    // STRICT INDEX ORDER: decode + schedule chunk `expected`, and only then move to
    // expected+1. The old code fired decodeAudioData for several chunks concurrently
    // inside a while-loop and scheduled them in DECODE-COMPLETION order — so a
    // later, shorter sentence that decoded first grabbed the first slot and the real
    // opening played out of order (heard as a mid-sentence start). One decode in
    // flight at a time keeps playback in order AND gapless (nextStart butt-join).
    if (!ctx || ctx.state !== "running" || draining) return;
    if (!pending.has(expected)) return;
    draining = true;
    const item = pending.get(expected); pending.delete(expected);
    const idx = expected; expected += 1;
    if (item.fmt === "pcm") {                          // raw PCM sub-chunk (streaming)
      try { schedule(idx, pcmToBuffer(item.buf, item.sr)); } catch (e) {}
      draining = false; drain();
    } else {                                           // mp3/wav — decode then schedule
      ctx.decodeAudioData(item.buf.slice(0)).then(ab => {
        schedule(idx, ab);
        draining = false;
        drain();               // process the next chunk, still in order
      }).catch(() => { draining = false; drain(); });  // skip a bad buffer, keep going
    }
  }

  window.addEventListener("message", (ev) => {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const chunks = (d.args && d.args.chunks) || [];
    for (const c of chunks) {
      if (seen.has(c.i)) continue;
      seen.add(c.i);
      pending.set(c.i, {buf: b64ToArrayBuffer(c.b64), fmt: c.fmt || "mp3", sr: c.sr || 24000});
    }
    if ((!ctx || ctx.state !== "running") && pending.size) {
      // Always attempt auto-resume — the record-click activation propagates to this
      // same-origin iframe, so no dedicated "Enable audio" click is needed. The button
      // text only shows if the browser actually blocks the resume.
      enable().catch(() => {
        stat.textContent = pending.size + " chunk(s) waiting — click Enable audio";
      });
    }
    drain();
  });

  send("streamlit:componentReady", {apiVersion:1});
  send("streamlit:setFrameHeight", {height:70});
</script>
</body>
</html>
